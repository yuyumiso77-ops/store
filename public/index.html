<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 피드백</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap" id="app">
  <h1>상품 피드백</h1>
  <p class="sub">구매하신 상품에 대한 의견을 들려주세요. 1분이면 충분해요.</p>

  <form id="form" novalidate>
    <div class="card">
      <label for="product">어떤 상품을 구매하셨나요?</label>
      <select id="product" required>
        <option value="">상품 선택</option>
      </select>
    </div>

    <div class="card">
      <span class="q">전체적으로 얼마나 만족하셨나요?</span>
      <div class="stars" data-field="rating"></div>
      <div class="hint" data-hint="rating"></div>
    </div>

    <div class="card">
      <span class="q">품질(맛·성능·상태)은 어떠셨나요?</span>
      <div class="stars" data-field="quality"></div>
      <div class="hint" data-hint="quality"></div>
    </div>

    <div class="card">
      <span class="q">가격에 만족하시나요?</span>
      <div class="stars" data-field="price"></div>
      <div class="hint" data-hint="price"></div>
    </div>

    <div class="card">
      <span class="q">다시 구매하실 의향이 있나요?</span>
      <div class="chips" data-field="repurchase">
        <button type="button" data-v="yes">네, 있어요</button>
        <button type="button" data-v="maybe">고민 중이에요</button>
        <button type="button" data-v="no">아니요</button>
      </div>
    </div>

    <div class="card">
      <span class="q">연령대 <span class="hint">(선택)</span></span>
      <div class="chips" data-field="ageGroup">
        <button type="button" data-v="10대">10대</button>
        <button type="button" data-v="20대">20대</button>
        <button type="button" data-v="30대">30대</button>
        <button type="button" data-v="40대">40대</button>
        <button type="button" data-v="50대">50대</button>
        <button type="button" data-v="60대 이상">60대 이상</button>
      </div>
    </div>

    <div class="card">
      <label for="comment">하고 싶은 말씀 <span class="hint">(선택)</span></label>
      <textarea id="comment" maxlength="1000" placeholder="좋았던 점, 아쉬웠던 점을 자유롭게 적어주세요."></textarea>
    </div>

    <button class="primary" type="submit" id="submit">의견 보내기</button>
    <p class="error" id="error"></p>
  </form>
</main>

<script>
const LABELS = ['', '매우 불만족', '불만족', '보통', '만족', '매우 만족'];
const state = { rating: 0, quality: 0, price: 0, repurchase: '', ageGroup: '' };

document.querySelectorAll('.stars').forEach((box) => {
  const field = box.dataset.field;
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '★';
    b.setAttribute('aria-label', i + '점 ' + LABELS[i]);
    b.onclick = () => {
      state[field] = i;
      box.querySelectorAll('button').forEach((s, idx) => s.classList.toggle('on', idx < i));
      document.querySelector(`[data-hint="${field}"]`).textContent = LABELS[i];
    };
    box.appendChild(b);
  }
});

document.querySelectorAll('.chips').forEach((box) => {
  const field = box.dataset.field;
  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      const same = state[field] === b.dataset.v;
      // 연령대는 다시 누르면 선택 해제
      state[field] = same && field === 'ageGroup' ? '' : b.dataset.v;
      box.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.v === state[field]));
    };
  });
});

async function loadProducts() {
  const sel = document.getElementById('product');
  const products = await fetch('/api/products').then((r) => r.json());
  products.forEach((p) => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.category ? `${p.name} (${p.category})` : p.name;
    sel.appendChild(o);
  });
  // QR 코드로 들어오면 상품 자동 선택
  const pid = new URLSearchParams(location.search).get('product');
  if (pid && products.some((p) => p.id === pid)) sel.value = pid;
}
loadProducts();

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  const btn = document.getElementById('submit');
  err.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: document.getElementById('product').value,
        ...state,
        comment: document.getElementById('comment').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '전송에 실패했어요.');
    document.getElementById('app').innerHTML =
      '<div class="card done"><div class="big">🙏</div><h1>감사합니다!</h1>' +
      '<p class="sub">보내주신 의견은 더 좋은 상품을 준비하는 데 소중히 쓰겠습니다.</p>' +
      '<a class="btn" href="/">다른 상품도 평가하기</a></div>';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
