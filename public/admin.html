<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 반응 분석</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap wide">
  <div class="product-head">
    <div>
      <h1>고객 반응 분석</h1>
      <p class="sub">직원들이 기록한 고객 반응, 장단점, 개선 의견을 품목·상품별로 모아 봅니다.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/" target="_blank">기록 화면 열기</a>
      <a class="btn accent" href="/api/admin/records.csv">CSV 내려받기</a>
    </div>
  </div>

  <div class="card">
    <div class="stats" id="stats"></div>
    <div id="staffBox" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>상품 등록</h2>
    <form id="addForm" class="row">
      <select id="category" required style="flex:0 1 160px"><option value="">품목 선택</option></select>
      <input type="text" id="name" placeholder="상품명 (예: 남성 쿨링 기능성 폴로 셔츠)" maxlength="100" required>
      <button class="btn accent" type="submit" style="flex:0 0 auto">추가</button>
    </form>
    <p class="error" id="addError"></p>
  </div>

  <div class="chips" id="filter" style="margin-bottom:16px"></div>
  <div id="products"></div>
</main>

<script>
const OUT = { bought: '구매함', hold: '보류', no: '미구매' };
const REACT = ['', '😠 매우 부정', '🙁 부정', '😐 보통', '🙂 긍정', '😍 매우 긍정'];
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === 'class' ? (n.className = v) : k.startsWith('on') ? (n[k] = v) : n.setAttribute(k, v)));
  kids.flat().forEach((c) => c !== '' && c != null && n.append(c instanceof Node ? c : document.createTextNode(String(c))));
  return n;
};
const fmt = (v) => (v == null ? '-' : v.toFixed(1));
const stat = (n, l) => el('div', { class: 'stat' }, el('div', { class: 'n' }, n), el('div', { class: 'l' }, l));

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function rank(title, list, total) {
  return el('div', {},
    el('div', { class: 'q' }, title),
    list.length
      ? el('ul', { class: 'rank' }, list.slice(0, 6).map((x) => el('li', {}, el('span', {}, x.name), el('span', {}, `${x.n}회 · ${Math.round((x.n / total) * 100)}%`))))
      : el('p', { class: 'hint' }, '아직 없어요'));
}

function renderProduct(p) {
  const toggle = el('button', {
    class: 'btn',
    onclick: async () => { await api(`/api/admin/products/${p.id}`, { method: 'PATCH', body: JSON.stringify({ active: !p.active }) }); load(); },
  }, p.active ? '조사 중지' : '조사 재개');

  const notes = p.notes.length
    ? el('ul', { class: 'comments' }, p.notes.map((n) => el('li', {},
        n.prosNote ? el('div', { class: 'note-line' }, '👍 ', n.prosNote) : '',
        n.consNote ? el('div', { class: 'note-line' }, '👎 ', n.consNote) : '',
        n.improvement ? el('div', { class: 'note-line' }, '💡 ', n.improvement) : '',
        el('div', { class: 'meta' }, `${n.staff} · ${REACT[n.reaction]} · ${OUT[n.outcome]} · ${new Date(n.createdAt).toLocaleString('ko-KR')}`))))
    : el('p', { class: 'hint' }, '아직 메모가 없어요.');

  return el('div', { class: 'card' + (p.active ? '' : ' inactive') },
    el('div', { class: 'product-head' },
      el('h2', {}, p.name, ' ', p.category ? el('span', { class: 'tag' }, p.category) : '', ' ', p.active ? '' : el('span', { class: 'tag' }, '중지됨')),
      el('div', { class: 'actions' }, toggle)),
    el('div', { class: 'stats' },
      stat(p.count, '기록 수'),
      stat(fmt(p.avgReaction), '평균 고객 반응 (5점)'),
      stat(p.buyRate == null ? '-' : p.buyRate + '%', '구매율'),
      stat(`${p.outcomes.hold} / ${p.outcomes.no}`, '보류 / 미구매'),
      stat(p.triedBuyRate == null ? '-' : p.triedBuyRate + '%', `시착·시타 후 구매율 (${p.triedCount}건)`)),
    p.count ? el('div', { class: 'cols' },
      rank('👍 장점으로 꼽힌 것', p.pros, p.count),
      rank('👎 단점으로 꼽힌 것', p.cons, p.count),
      rank('🚫 구매하지 않은 이유', p.noBuyReasons, Math.max(1, p.outcomes.hold + p.outcomes.no))) : '',
    p.missing.length ? el('div', { style: 'margin-top:16px' }, el('div', { class: 'q' }, '🔍 찾았지만 없던 사이즈·색상'),
      el('ul', { class: 'comments' }, p.missing.map((x) => el('li', {}, x.missing, el('div', { class: 'meta' }, `${x.staff} · ${new Date(x.createdAt).toLocaleString('ko-KR')}`))))) : '',
    el('div', { style: 'margin-top:16px' }, el('div', { class: 'q' }, '직원 메모 (장점 · 단점 · 개선 아이디어)'), notes));
}

async function load() {
  const data = await api('/api/admin/summary');
  const ps = data.products;
  const recorded = ps.filter((p) => p.count);
  const total = recorded.reduce((a, p) => a + p.count, 0);
  const avgReact = total ? recorded.reduce((a, p) => a + p.avgReaction * p.count, 0) / total : null;
  const bought = recorded.reduce((a, p) => a + p.outcomes.bought, 0);
  const worst = recorded.slice().sort((a, b) => a.avgReaction - b.avgReaction)[0];
  $('stats').replaceChildren(
    stat(data.totalRecords, '총 기록 수'),
    stat(fmt(avgReact), '평균 고객 반응'),
    stat(total ? Math.round((bought / total) * 100) + '%' : '-', '전체 구매율'),
    stat(worst ? worst.name : '-', '반응이 가장 낮은 상품'));
  $('staffBox').replaceChildren(...(data.staff.length
    ? [el('span', { class: 'hint' }, '직원별 기록: '), ...data.staff.map((s) => el('span', { class: 'pill' }, `${s.name} ${s.n}`))]
    : []));
  LAST = ps;
  renderList();
}

// 품목 필터
let LAST = [], FILTER = '', CATS = [];
function renderList() {
  $('filter').replaceChildren(...['', ...CATS].map((c) => {
    const n = LAST.filter((p) => !c || p.category === c).length;
    return el('button', { type: 'button', class: FILTER === c ? 'on' : '', onclick: () => { FILTER = c; renderList(); } }, `${c || '전체'} ${n}`);
  }));
  const ps = LAST.filter((p) => !FILTER || p.category === FILTER);
  $('products').replaceChildren(...(ps.length
    ? ps.slice().sort((a, b) => b.active - a.active || b.count - a.count).map(renderProduct)
    : [el('div', { class: 'card hint' }, LAST.length ? '이 품목에 등록된 상품이 없어요.' : '위에서 조사할 상품을 먼저 등록해 주세요.')]));
}

async function init() {
  const o = await api('/api/options');
  CATS = o.categories;
  CATS.forEach((c) => $('category').add(new Option(c, c)));
  load();
}
function $(id) { return document.getElementById(id); }

$('addForm').onsubmit = async (e) => {
  e.preventDefault();
  $('addError').textContent = '';
  try {
    await api('/api/admin/products', { method: 'POST', body: JSON.stringify({ name: $('name').value, category: $('category').value }) });
    $('name').value = '';
    load();
  } catch (ex) { $('addError').textContent = ex.message; }
};
init();
</script>
</body>
</html>
