<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피드백 관리</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main class="wrap wide">
  <div class="product-head">
    <div>
      <h1>피드백 관리</h1>
      <p class="sub">매장 판매 상품의 고객 의견을 한눈에 확인하세요.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/" target="_blank">설문 페이지 열기</a>
      <a class="btn accent" href="/api/admin/feedback.csv">CSV 내려받기</a>
    </div>
  </div>

  <div class="stats card" id="stats"></div>

  <div class="card">
    <h2>상품 등록</h2>
    <form id="addForm" class="row">
      <input type="text" id="name" placeholder="상품명 (예: 수제 딸기잼)" maxlength="100" required>
      <input type="text" id="category" placeholder="분류 (선택, 예: 식품)" maxlength="50">
      <button class="btn accent" type="submit" style="flex:0 0 auto">추가</button>
    </form>
    <p class="error" id="addError"></p>
  </div>

  <div id="products"></div>
</main>

<script>
const REP = { yes: '있음', maybe: '고민 중', no: '없음' };
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === 'class' ? (n.className = v) : k.startsWith('on') ? (n[k] = v) : n.setAttribute(k, v)));
  kids.flat().forEach((c) => n.append(c instanceof Node ? c : document.createTextNode(String(c))));
  return n;
};
const fmt = (v) => (v == null ? '-' : v.toFixed(1));

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function stat(n, l) {
  return el('div', { class: 'stat' }, el('div', { class: 'n' }, n), el('div', { class: 'l' }, l));
}

function renderProduct(p) {
  const surveyUrl = `${location.origin}/?product=${encodeURIComponent(p.id)}`;
  const qrBox = el('div', { class: 'qr' });
  const total = p.count || 1;
  const repTotal = p.repurchase.yes + p.repurchase.maybe + p.repurchase.no;

  const toggle = el('button', {
    class: 'btn',
    onclick: async () => { await api(`/api/admin/products/${p.id}`, { method: 'PATCH', body: JSON.stringify({ active: !p.active }) }); load(); },
  }, p.active ? '설문 중지' : '설문 재개');

  const qrBtn = el('button', {
    class: 'btn',
    onclick: () => {
      if (!qrBox.childElementCount) {
        const code = el('div');
        if (window.QRCode) new QRCode(code, { text: surveyUrl, width: 180, height: 180 });
        else code.append(el('p', { class: 'hint' }, 'QR 라이브러리를 불러오지 못했어요. 아래 주소를 사용하세요.'));
        code.append(el('p', { class: 'hint', style: 'word-break:break-all' }, surveyUrl));
        qrBox.append(
          el('div', { class: 'q' }, p.name),
          code,
          el('p', { class: 'hint' }, 'QR을 찍고 의견을 남겨주세요'),
          el('button', { class: 'btn', onclick: () => { qrBox.classList.add('printing'); window.print(); qrBox.classList.remove('printing'); } }, 'QR 인쇄')
        );
      }
      qrBox.classList.toggle('show');
    },
  }, 'QR 코드');

  const bars = [5, 4, 3, 2, 1].map((n) =>
    el('div', { class: 'bar' }, el('span', { class: 'lbl' }, `${n}★`),
      el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${(p.ratingDist[n - 1] / total) * 100}%` })),
      String(p.ratingDist[n - 1]))
  );

  const comments = p.recentComments.length
    ? el('ul', { class: 'comments' }, p.recentComments.map((c) =>
        el('li', {}, c.comment, el('div', { class: 'meta' }, `${'★'.repeat(c.rating)} · ${new Date(c.createdAt).toLocaleString('ko-KR')}`))))
    : el('p', { class: 'hint' }, '아직 작성된 의견이 없어요.');

  return el('div', { class: 'card' + (p.active ? '' : ' inactive') },
    el('div', { class: 'product-head' },
      el('div', {}, el('h2', {}, p.name, ' ', p.category ? el('span', { class: 'tag' }, p.category) : '', p.active ? '' : el('span', { class: 'tag' }, '중지됨'))),
      el('div', { class: 'actions' }, qrBtn, toggle)),
    el('div', { class: 'stats' },
      stat(p.count, '응답 수'),
      stat(fmt(p.avgRating), '전체 만족도 (5점)'),
      stat(fmt(p.avgQuality), '품질 (5점)'),
      stat(fmt(p.avgPrice), '가격 만족도 (5점)'),
      stat(repTotal ? Math.round((p.repurchase.yes / repTotal) * 100) + '%' : '-', `재구매 의향 있음 (고민 ${p.repurchase.maybe} · 없음 ${p.repurchase.no})`)),
    p.count ? el('div', { style: 'margin-top:12px' }, bars) : '',
    el('div', { style: 'margin-top:12px' }, el('div', { class: 'q' }, '최근 의견'), comments),
    qrBox);
}

async function load() {
  const data = await api('/api/admin/summary');
  const ps = data.products;
  const rated = ps.filter((p) => p.avgRating != null);
  const overall = rated.length ? rated.reduce((a, p) => a + p.avgRating * p.count, 0) / rated.reduce((a, p) => a + p.count, 0) : null;
  const worst = rated.slice().sort((a, b) => a.avgRating - b.avgRating)[0];
  document.getElementById('stats').replaceChildren(
    stat(data.totalFeedback, '총 응답 수'),
    stat(ps.filter((p) => p.active).length, '설문 진행 중인 상품'),
    stat(fmt(overall), '평균 만족도'),
    stat(worst ? worst.name : '-', '개선이 필요한 상품'));

  const box = document.getElementById('products');
  box.replaceChildren(...(ps.length
    ? ps.slice().sort((a, b) => b.active - a.active || b.count - a.count).map(renderProduct)
    : [el('div', { class: 'card hint' }, '위에서 상품을 먼저 등록해 주세요.')]));
}

document.getElementById('addForm').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('addError');
  err.textContent = '';
  try {
    await api('/api/admin/products', {
      method: 'POST',
      body: JSON.stringify({ name: document.getElementById('name').value, category: document.getElementById('category').value }),
    });
    e.target.reset();
    load();
  } catch (ex) { err.textContent = ex.message; }
};

load();
</script>
</body>
</html>
