<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고객 반응 분석</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap wide">
  <div class="product-head">
    <div>
      <h1>고객 반응 분석</h1>
      <p class="sub">직원들이 상품별로 평가한 고객 반응, 판매 반응, 장단점, 개선 의견을 모아 봅니다.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/" target="_blank">평가 화면 열기</a>
      <a class="btn accent" href="/api/admin/evaluations.csv">CSV 내려받기</a>
    </div>
  </div>

  <div class="card">
    <div class="stats" id="stats"></div>
    <div id="staffBox" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>상품 이미지로 등록</h2>
    <p class="hint" style="margin-top:-6px">이미지 파일명이 <b>품번</b>이 됩니다 (예: <code>GM24-PL101.jpg</code> → 품번 GM24-PL101).
      처음 보는 품번은 선택한 품목으로 새로 등록되고, 이미 있는 품번은 이미지만 바뀝니다.<br>
      <b>상품 정보 CSV</b>(열: 품번, 상품명, 품목)를 이미지와 함께 넣으면 상품명·품목도 한 번에 등록됩니다.</p>
    <div class="row" style="align-items:center">
      <select id="upCategory" style="flex:0 1 160px"><option value="">품목 선택</option></select>
      <label class="drop" id="drop">
        <input type="file" id="files" accept="image/*,.csv" multiple hidden>
        📷 이미지·CSV 선택 또는 여기로 끌어다 놓기 (여러 개 가능)
      </label>
    </div>
    <ul class="uplog" id="uplog"></ul>

    <details style="margin-top:12px">
      <summary class="hint" style="cursor:pointer">이미지 없이 직접 등록</summary>
      <form id="addForm" class="row" style="margin-top:10px">
        <select id="category" required style="flex:0 1 140px"><option value="">품목 선택</option></select>
        <input type="text" id="code" placeholder="품번 (선택)" maxlength="60" style="flex:0 1 180px">
        <input type="text" id="name" placeholder="상품명" maxlength="100" required>
        <button class="btn accent" type="submit" style="flex:0 0 auto">추가</button>
      </form>
    </details>
    <p class="error" id="addError"></p>
  </div>

  <div class="row" style="align-items:center;margin-bottom:12px">
    <div class="chips" id="filter" style="flex:1 1 auto"></div>
    <input type="search" id="search" placeholder="품번·상품명 검색" style="flex:0 1 240px">
  </div>
  <div id="products"></div>
</main>

<script>
const SALES = { good: '잘 팔림', normal: '판매 보통', poor: '잘 안 팔림' };
const REACT = ['', '😠 매우 나쁨', '🙁 나쁨', '😐 보통', '🙂 좋음', '😍 매우 좋음'];
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => (k === 'class' ? (n.className = v) : k.startsWith('on') ? (n[k] = v) : n.setAttribute(k, v)));
  kids.flat().forEach((c) => c !== '' && c != null && n.append(c instanceof Node ? c : document.createTextNode(String(c))));
  return n;
};
const fmt = (v) => (v == null ? '-' : v.toFixed(1));
const stat = (n, l) => el('div', { class: 'stat' }, el('div', { class: 'n' }, n), el('div', { class: 'l' }, l));

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function rank(title, list, total) {
  return el('div', {},
    el('div', { class: 'q' }, title),
    list.length
      ? el('ul', { class: 'rank' }, list.slice(0, 6).map((x) => el('li', {}, el('span', {}, x.name), el('span', {}, `${x.n}회 · ${Math.round((x.n / total) * 100)}%`))))
      : el('p', { class: 'hint' }, '아직 없어요'));
}

function renderProduct(p) {
  const toggle = el('button', {
    class: 'btn',
    onclick: async () => { await api(`/api/admin/products/${p.id}`, { method: 'PATCH', body: JSON.stringify({ active: !p.active }) }); load(); },
  }, p.active ? '조사 중지' : '조사 재개');

  const notes = p.notes.length
    ? el('ul', { class: 'comments' }, p.notes.map((n) => el('li', {},
        n.prosNote ? el('div', { class: 'note-line' }, '👍 ', n.prosNote) : '',
        n.consNote ? el('div', { class: 'note-line' }, '👎 ', n.consNote) : '',
        n.improvement ? el('div', { class: 'note-line' }, '💡 ', n.improvement) : '',
        el('div', { class: 'meta' }, `${n.staff} · ${REACT[n.reaction]} · ${SALES[n.sales]} · ${new Date(n.updatedAt).toLocaleString('ko-KR')}`))))
    : el('p', { class: 'hint' }, '아직 의견이 없어요.');

  const fileIn = el('input', { type: 'file', accept: 'image/*', hidden: '' });
  fileIn.onchange = async () => {
    if (!fileIn.files[0]) return;
    if (!p.code) return alert('이미지를 바꾸려면 먼저 [수정]에서 품번을 입력해 주세요.');
    try { await uploadImage(fileIn.files[0], p.code, p.category); load(); } catch (ex) { alert(ex.message); }
  };
  const imgBtn = el('button', { class: 'btn', onclick: () => fileIn.click() }, p.imageUrl ? '이미지 교체' : '이미지 추가');
  const editBtn = el('button', { class: 'btn', onclick: () => { head.replaceWith(editForm(p)); } }, '수정');
  const head = el('div', { class: 'product-head' },
    el('div', { class: 'phead' },
      p.imageUrl ? el('img', { class: 'aimg', src: p.imageUrl, alt: p.name, loading: 'lazy' }) : el('div', { class: 'aimg noimg' }, '이미지 없음'),
      el('div', {},
        el('h2', { style: 'margin:0 0 4px' }, p.name),
        el('div', {}, p.code ? el('span', { class: 'tag' }, p.code) : '', ' ', el('span', { class: 'tag' }, p.category), ' ', p.active ? '' : el('span', { class: 'tag' }, '중지됨')))),
    el('div', { class: 'actions' }, editBtn, imgBtn, toggle, fileIn));

  return el('div', { class: 'card' + (p.active ? '' : ' inactive') },
    head,
    el('div', { class: 'stats' },
      stat(p.count, '평가한 직원 수'),
      stat(fmt(p.avgReaction), '평균 고객 반응 (5점)'),
      stat(`${p.sales.good} · ${p.sales.normal} · ${p.sales.poor}`, '판매 반응: 잘 팔림 · 보통 · 안 팔림')),
    p.count ? el('div', { class: 'cols' },
      rank('👍 장점으로 꼽힌 것', p.pros, p.count),
      rank('👎 단점으로 꼽힌 것', p.cons, p.count),
      rank('🚫 안 팔린 이유', p.noBuyReasons, p.count),
      rank('👥 주 구매 고객층', [...p.ageGroups, ...p.genders], p.count)) : '',
    p.missing.length ? el('div', { style: 'margin-top:16px' }, el('div', { class: 'q' }, '🔍 자주 찾았는데 없던 사이즈·색상'),
      el('ul', { class: 'comments' }, p.missing.map((x) => el('li', {}, x.missing, el('div', { class: 'meta' }, `${x.staff} · ${new Date(x.updatedAt).toLocaleString('ko-KR')}`))))) : '',
    el('div', { style: 'margin-top:16px' }, el('div', { class: 'q' }, '직원 의견 (장점 · 단점 · 개선 아이디어)'), notes));
}

function editForm(p) {
  const cat = el('select', {}, CATS.map((c) => el('option', { value: c }, c)));
  cat.value = p.category;
  const code = el('input', { type: 'text', value: p.code, placeholder: '품번', maxlength: '60' });
  const name = el('input', { type: 'text', value: p.name, placeholder: '상품명', maxlength: '100' });
  const err = el('p', { class: 'error' });
  const f = el('form', { class: 'row', style: 'align-items:center' }, cat, code, name,
    el('button', { class: 'btn accent', type: 'submit', style: 'flex:0 0 auto' }, '저장'),
    el('button', { class: 'btn', type: 'button', style: 'flex:0 0 auto', onclick: () => load() }, '취소'));
  f.onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api(`/api/admin/products/${p.id}`, { method: 'PATCH', body: JSON.stringify({ category: cat.value, code: code.value, name: name.value }) });
      load();
    } catch (ex) { err.textContent = ex.message; }
  };
  return el('div', {}, f, err);
}

// 업로드 전에 브라우저에서 최대 1000px JPEG로 줄임
async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error('이미지를 읽을 수 없어요 (JPG·PNG·WEBP를 사용해 주세요)'); }
  const scale = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
}
async function uploadImage(file, code, category) {
  const blob = await shrink(file);
  const res = await fetch(`/api/admin/images/${encodeURIComponent(code)}?category=${encodeURIComponent(category || '')}`, {
    method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: blob,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '업로드 실패');
  return data;
}
const codeFromName = (n) => n.replace(/\.[^.]+$/, '').trim();

// 간단한 CSV 파서 (따옴표·쉼표·줄바꿈 처리)
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
async function readCsvFile(f) {
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) text = new TextDecoder('euc-kr').decode(buf); // 엑셀 기본 저장(CP949) 대응
  const [head, ...rows] = parseCsv(text);
  const idx = (names) => head.findIndex((h) => names.includes(h.trim()));
  const ci = idx(['품번', 'code', 'CODE', 'STYLE']), ni = idx(['상품명', 'name', '이름']), ki = idx(['품목', 'category']);
  if (ci < 0) throw new Error('첫 줄에 "품번" 열이 필요해요');
  return rows.map((r) => ({ code: (r[ci] || '').trim(), name: ni >= 0 ? (r[ni] || '').trim() : '', category: ki >= 0 ? (r[ki] || '').trim() : '' }));
}

async function uploadMany(files) {
  const log = $('uplog');
  const category = $('upCategory').value;
  // CSV 먼저 처리해서 상품명·품목을 만든 뒤 이미지를 붙임
  for (const f of files.filter((f) => /\.csv$/i.test(f.name))) {
    const li = el('li', {}, `⏳ ${f.name}`);
    log.prepend(li);
    try {
      const rows = await readCsvFile(f);
      const r = await api('/api/admin/products/import', { method: 'POST', body: JSON.stringify({ rows }) });
      li.textContent = `📄 ${f.name} — 새 상품 ${r.created}개, 정보 수정 ${r.updated}개` + (r.errors.length ? `, 오류 ${r.errors.length}건` : '');
      r.errors.slice(0, 20).forEach((e) => log.prepend(el('li', { class: 'fail' }, '❌ ' + e)));
    } catch (ex) {
      li.textContent = `❌ ${f.name} — ${ex.message}`;
      li.className = 'fail';
    }
  }
  for (const f of files.filter((f) => !/\.csv$/i.test(f.name))) {
    const code = codeFromName(f.name);
    const li = el('li', {}, `⏳ ${code}`);
    log.prepend(li);
    try {
      const r = await uploadImage(f, code, category);
      li.textContent = r.created ? `✅ ${code} — 새 상품으로 등록 (${r.product.category})` : r.hadImage ? `🔄 ${code} — 이미지 교체 (${r.product.name})` : `🖼️ ${code} — 이미지 등록 (${r.product.name})`;
    } catch (ex) {
      li.textContent = `❌ ${code} — ${ex.message}`;
      li.className = 'fail';
    }
  }
  load();
}

async function load() {
  const data = await api('/api/admin/summary');
  const ps = data.products;
  const recorded = ps.filter((p) => p.count);
  const total = recorded.reduce((a, p) => a + p.count, 0);
  const avgReact = total ? recorded.reduce((a, p) => a + p.avgReaction * p.count, 0) / total : null;
  const worst = recorded.slice().sort((a, b) => a.avgReaction - b.avgReaction)[0];
  const best = recorded.slice().sort((a, b) => b.avgReaction - a.avgReaction)[0];
  $('stats').replaceChildren(
    stat(data.totalEvaluations, '총 평가 수'),
    stat(`${ps.filter((p) => p.active && p.count).length} / ${data.activeProducts}`, '평가된 상품'),
    stat(fmt(avgReact), '평균 고객 반응'),
    stat(best ? best.name : '-', '반응이 가장 좋은 상품'),
    stat(worst ? worst.name : '-', '반응이 가장 낮은 상품'));
  $('staffBox').replaceChildren(...(data.staff.length
    ? [el('span', { class: 'hint' }, '직원별 진행: '), ...data.staff.map((s) => el('span', { class: 'pill' }, `${s.name} ${s.done}/${data.activeProducts}`))]
    : []));
  LAST = ps;
  renderList();
}

// 품목 필터
let LAST = [], FILTER = '', CATS = [];
function renderList() {
  $('filter').replaceChildren(...['', ...CATS].map((c) => {
    const n = LAST.filter((p) => !c || p.category === c).length;
    return el('button', { type: 'button', class: FILTER === c ? 'on' : '', onclick: () => { FILTER = c; renderList(); } }, `${c || '전체'} ${n}`);
  }));
  const q = $('search').value.trim().toLowerCase();
  const ps = LAST.filter((p) => (!FILTER || p.category === FILTER) && (!q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)));
  $('products').replaceChildren(...(ps.length
    ? ps.slice().sort((a, b) => b.active - a.active || b.count - a.count).map(renderProduct)
    : [el('div', { class: 'card hint' }, LAST.length ? '이 품목에 등록된 상품이 없어요.' : '위에서 조사할 상품을 먼저 등록해 주세요.')]));
}

async function init() {
  const o = await api('/api/options');
  CATS = o.categories;
  CATS.forEach((c) => { $('category').add(new Option(c, c)); $('upCategory').add(new Option(c, c)); });
  $('search').oninput = renderList;
  $('files').onchange = () => { uploadMany([...$('files').files]); $('files').value = ''; };
  const drop = $('drop');
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); uploadMany([...e.dataTransfer.files].filter((f) => f.type.startsWith('image/') || /\.csv$/i.test(f.name))); };
  load();
}
function $(id) { return document.getElementById(id); }

$('addForm').onsubmit = async (e) => {
  e.preventDefault();
  $('addError').textContent = '';
  try {
    await api('/api/admin/products', { method: 'POST', body: JSON.stringify({ name: $('name').value, code: $('code').value, category: $('category').value }) });
    $('code').value = '';
    $('name').value = '';
    load();
  } catch (ex) { $('addError').textContent = ex.message; }
};
init();
</script>
</body>
</html>
